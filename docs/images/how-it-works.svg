<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372" width="920" height="372" role="img" aria-labelledby="t d"><title id="t">How SocialVec learns social embeddings</title><desc id="d">Four steps: sample users and the accounts they follow; keep popular accounts as entities; treat each anonymised follow list as a context; train Word2Vec so co-followed accounts are close.</desc><style>text{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.b{font-weight:700}.sb{font-weight:600}.halo{paint-order:stroke;stroke-width:4px;stroke-linejoin:round}.bg{fill:#fcfcfb}.panel{fill:#f4f3ee}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#898781}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.neutral{fill:#b4b2a9}.bd{stroke:#e1e0d9;fill:none}.ring{stroke:#fcfcfb}.halo{stroke:#fcfcfb}.chip{fill:#fcfcfb;stroke:#c3c2b7}.ln{stroke:#b4b2a9}.sn{stroke:#b4b2a9;fill:#fcfcfb}.c1{fill:#2a78d6}.lc1{stroke:#2a78d6}.c2{fill:#eb6834}.lc2{stroke:#eb6834}.c3{fill:#1baf7a}.lc3{stroke:#1baf7a}.c4{fill:#eda100}.lc4{stroke:#eda100}.c5{fill:#e87ba4}.lc5{stroke:#e87ba4}.c6{fill:#008300}.lc6{stroke:#008300}.c7{fill:#6250d6}.lc7{stroke:#6250d6}.c8{fill:#e34948}.lc8{stroke:#e34948}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.panel{fill:#242422}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#898781}.grid{stroke:#2c2c2a}.axis{stroke:#4a4a46}.neutral{fill:#6b6a64}.bd{stroke:#2c2c2a;fill:none}.ring{stroke:#1a1a19}.halo{stroke:#1a1a19}.chip{fill:#1a1a19;stroke:#4a4a46}.ln{stroke:#6b6a64}.sn{stroke:#6b6a64;fill:#1a1a19}.c1{fill:#3987e5}.lc1{stroke:#3987e5}.c2{fill:#d95926}.lc2{stroke:#d95926}.c3{fill:#199e70}.lc3{stroke:#199e70}.c4{fill:#c98500}.lc4{stroke:#c98500}.c5{fill:#d55181}.lc5{stroke:#d55181}.c6{fill:#0ca30c}.lc6{stroke:#0ca30c}.c7{fill:#9085e9}.lc7{stroke:#9085e9}.c8{fill:#e66767}.lc8{stroke:#e66767}}</style><rect class="bg" x="0.5" y="0.5" width="919" height="371" rx="14"/><rect class="bd" x="0.5" y="0.5" width="919" height="371" rx="14"/><rect class="panel" x="24" y="24" width="200" height="324" rx="12"/><circle class="c1" cx="48" cy="52" r="12"/><text x="48.0" y="56.5" class="b" font-size="13" text-anchor="middle" fill="#fff">1</text><text x="68.0" y="57.0" class="t1 b" font-size="15" text-anchor="start" >Sample users</text><text x="40.0" y="282.0" class="t2" font-size="12.5" text-anchor="start" >1.3M random users, plus</text><text x="40.0" y="300.0" class="t2" font-size="12.5" text-anchor="start" >every account each of</text><text x="40.0" y="318.0" class="t2" font-size="12.5" text-anchor="start" >them follows.</text><g class="ln" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M229.0,164.0 L244.0,164.0"/><path d="M238.0,167.6 L244.0,164.0 L238.0,160.4"/></g><rect class="panel" x="248" y="24" width="200" height="324" rx="12"/><circle class="c1" cx="272" cy="52" r="12"/><text x="272.0" y="56.5" class="b" font-size="13" text-anchor="middle" fill="#fff">2</text><text x="292.0" y="57.0" class="t1 b" font-size="15" text-anchor="start" >Pick entities</text><text x="264.0" y="282.0" class="t2" font-size="12.5" text-anchor="start" >Accounts followed by 350+</text><text x="264.0" y="300.0" class="t2" font-size="12.5" text-anchor="start" >sampled users become</text><text x="264.0" y="318.0" class="t2" font-size="12.5" text-anchor="start" >entities: ~200K out of 90M.</text><g class="ln" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M453.0,164.0 L468.0,164.0"/><path d="M462.0,167.6 L468.0,164.0 L462.0,160.4"/></g><rect class="panel" x="472" y="24" width="200" height="324" rx="12"/><circle class="c1" cx="496" cy="52" r="12"/><text x="496.0" y="56.5" class="b" font-size="13" text-anchor="middle" fill="#fff">3</text><text x="516.0" y="57.0" class="t1 b" font-size="15" text-anchor="start" >Build contexts</text><text x="488.0" y="282.0" class="t2" font-size="12.5" text-anchor="start" >Drop who the user is. Keep</text><text x="488.0" y="300.0" class="t2" font-size="12.5" text-anchor="start" >the set of entities they</text><text x="488.0" y="318.0" class="t2" font-size="12.5" text-anchor="start" >co-follow, like words in</text><text x="488.0" y="336.0" class="t2" font-size="12.5" text-anchor="start" >a sentence.</text><g class="ln" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M677.0,164.0 L692.0,164.0"/><path d="M686.0,167.6 L692.0,164.0 L686.0,160.4"/></g><rect class="panel" x="696" y="24" width="200" height="324" rx="12"/><circle class="c1" cx="720" cy="52" r="12"/><text x="720.0" y="56.5" class="b" font-size="13" text-anchor="middle" fill="#fff">4</text><text x="740.0" y="57.0" class="t1 b" font-size="15" text-anchor="start" >Learn vectors</text><text x="712.0" y="282.0" class="t2" font-size="12.5" text-anchor="start" >Word2Vec (skip-gram) pulls</text><text x="712.0" y="300.0" class="t2" font-size="12.5" text-anchor="start" >co-followed accounts</text><text x="712.0" y="318.0" class="t2" font-size="12.5" text-anchor="start" >together in a 100-d space.</text><path class="ln" fill="none" stroke-width="1" opacity="0.75" d="M70,110 C118,110 126,96 176,96"/><path class="ln" fill="none" stroke-width="1" opacity="0.75" d="M70,110 C118,110 126,122 176,122"/><path class="ln" fill="none" stroke-width="1" opacity="0.75" d="M70,110 C118,110 126,174 176,174"/><path class="ln" fill="none" stroke-width="1" opacity="0.75" d="M70,160 C118,160 126,122 176,122"/><path class="ln" fill="none" stroke-width="1" opacity="0.75" d="M70,160 C118,160 126,148 176,148"/><path class="ln" fill="none" stroke-width="1" opacity="0.75" d="M70,160 C118,160 126,174 176,174"/><path class="ln" fill="none" stroke-width="1" opacity="0.75" d="M70,160 C118,160 126,200 176,200"/><path class="ln" fill="none" stroke-width="1" opacity="0.75" d="M70,210 C118,210 126,122 176,122"/><path class="ln" fill="none" stroke-width="1" opacity="0.75" d="M70,210 C118,210 126,174 176,174"/><path class="ln" fill="none" stroke-width="1" opacity="0.75" d="