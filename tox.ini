[tox]
envlist = py39, py310, py311, py312, flake8

[testenv:flake8]
basepython = python
deps = flake8
commands = flake8 socialvec tests

[testenv]
deps = pytest
extras = classifier
# The tests download the real models (~150 MB each) once into the cache folder.
passenv = SOCIALVEC_HOME
commands = pytest {posargs:tests}
