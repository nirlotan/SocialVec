name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}${{ matrix.extras == '' && ' (no extras)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        extras: ["[classifier,api]"]
        include:
          # Check that the embeddings work without TensorFlow and Flask installed.
          - python-version: "3.12"
            extras: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The models and metadata (~330 MB) only change when config.yaml does.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/socialvec
          key: socialvec-data-${{ hashFiles('socialvec/config.yaml') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".${{ matrix.extras }}" pytest

      - name: Test
        run: pytest -v
